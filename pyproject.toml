[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hannom-parallel"
version = "0.1.0"
description = "Local-first Hán Nôm–Quốc ngữ OCR, alignment, validation, and packaging pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "NLP Project team" }]
dependencies = [
  "pymupdf==1.28.2",
  "numpy==2.2.6",
  "scipy==1.16.3",
  "pillow==12.3.0",
  "pandas==2.3.3",
  "openpyxl==3.1.5",
  "PyYAML==6.0.3",
  "pydantic==2.12.4",
  "typer==0.20.0",
  "rich==14.2.0",
  "streamlit==1.51.0",
  "requests==2.32.5",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
ocr = [
  # Local OCR (pinned after the 2026-11-08 benchmark). Windows torch is CPU-only
  # on PyPI; the GPU stack needs --index-url https://download.pytorch.org/whl/cu126
  # pip install torch==2.14.1+cu126 torchvision==0.29.1+cu126 --index-url https://download.pytorch.org/whl/cu126
  # paddlex 3.7.2 prefers PyYAML==6.0.2; this package pins PyYAML==6.0.3 (patch-level, tests pass).
  # transformers must stay at 4.46.3: transformers 5.x is incompatible with Vintern's custom code.
  # A no-op flash_attn shim exists site-wide because the stock Vintern config sets use_flash_attn=false.
  "paddlepaddle==3.3.1",
  "paddleocr==3.7.0",
  "transformers==4.46.3",
  "einops==0.8.2",
  "timm==1.0.31",
  "accelerate==1.15.0",
  # torch and torchvision are NOT on PyPI with CUDA for this host; install from the cu126 index (see above).
]

[project.scripts]
hannom = "hannom.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
