#              for the reading "gùng" lists the standard head 𡃕 and a
#              *form* spelling U+F021D — the two are the same glyph, one
#              encoded in Unicode and one in the Kim Hán Nôm font.
#              Book-side, U+F021D appears in the Tap1 OCR
#              (T1_CamPhong_Tap1/0185.json; one occurrence recorded in the
#              2026-11-13 clean tally).
#
# Everything else the books print in the PUA planes stays unmapped until
