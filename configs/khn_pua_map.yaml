# Human-curated PUA → standard Nôm mapping for the assigned books.
#
# Keys: hex code point of the Kim Hán Nôm PUA glyph (as printed in the
# scan). Values: the single standard Nôm character it stands for.
#
# Rules (see hannom.pua_map):
#   * Only mappings with explicit source evidence may be added.
#   * Unmapped PUA code points are NEVER guessed. They stay unmatchable,
#     unlearnable and unflagged (exactly the pre-fix behaviour) and are
#     replaced by 〓 at clean time, as before.
#   * Every entry must be verified visually against the scan by the
#     reviewer who adds it. The citation belongs in the comment.
