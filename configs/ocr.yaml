# OCR routing. The Kim Hán Nôm API is used first for Nôm pages. Once the
# quota is exhausted (or the API cannot serve a page), the pipeline switches
# to the local models; local results are written to
# data/ocr/<book>/local_fallback/<page>.json so they never clash with the
# API-handled files in data/ocr/<book>/. Quốc ngữ stays on the local Vintern
# engine (the Kim Hán Nôm API cannot OCR Quốc ngữ).
engines:
  mock:
    kind: mock
    description: "Deterministic fixture engine for tests and dry runs only"
  kimhannom:
    kind: api
    description: "Approved external OCR service"
  paddleocr_vl:
    kind: local
    adapter: "hannom.ocr.local_paddle:PaddleOCREngine"
    description: "Local PP-OCR/PaddleOCR-VL adapter; import is lazy"
  ppocrv5:
    kind: local
    adapter: "hannom.ocr.local_paddle:PaddleOCREngine"
    description: "Fallback local PP-OCRv5 adapter"
  vintern_1b_v2:
    kind: local
    adapter: "hannom.ocr.local_vintern:VinternEngine"
    description: "Full-page Vintern-1B-v2 transcription for archaic Vietnamese (benchmark 2026-11-08; ~35 s/page, 2.3 GB VRAM); one full-page box per image"

routing:
  nom:
    primary: kimhannom
    fallback: paddleocr_vl
    low_confidence_threshold: 0.70
    agreement_threshold: 0.85
  quoc_ngu:
    primary: vintern_1b_v2
    # The Kim Hán Nôm API is Hán/Nôm-only and must not receive QN pages.
    second_opinion: none
    # No fallback configured for QN: Vintern-1B-v2 is the QN engine.
    low_confidence_threshold: 0.75
    agreement_threshold: 0.85
  api_mode: api_first
  max_pages_per_api_batch: 12
