method_notes:
  - "Pipeline cục bộ: trích ảnh gốc, phân loại trang, OCR, PPOCRLabel, làm sạch, căn hàng, text_diff, đánh giá và đóng gói."
  - "923/950 ảnh được sao chép nguyên byte từ JPEG nhúng; 27 ảnh xoay được chuyển hướng lossless ở độ phân giải gốc (không upscale)."
  - "Hai file <Book>_updated.pdf (Tập 1 và Tập 2; Sách 3 không cần) đã tạo bằng tools/build_updated_pdf.py từ ảnh trích xuất: ảnh nhúng nguyên byte, một ảnh/trang, số trang giữ nguyên (282/550, trang xoay: 263+274 / 287+295+296+305+310+335+339+345+349+364+386+392+405+414+416+419+426+447+452+459+461+499+505+515+525). HÀNH ĐỘNG CẦN LÀM TRƯỚC KHI NỘP: thông báo cho người giao sách về hai file _updated.pdf và danh sách trang xoay."
  - "Kim Hán Nôm API chỉ dùng như ý kiến thứ hai có đo lường; không dùng nhiều tài khoản và không gửi ảnh mặc định."
  - "Từ điển là tùy chọn; ký tự không có trong từ điển không bị tự động tô đỏ mà vào hàng đợi review."
  - "Yellow không bao giờ được tạo tự động; chỉ dùng cho các trường hợp đặc biệt trong quy định và luôn được ghi lý do."
  - "image_map.json ban đầu là phân hoạch theo khối lượng mực; phải đối chiếu lại với OCR/căn hàng trước khi nộp."

